services:
  # Deine Datenbank (wie du sie gepostet hast)
  db:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: secure
      PGDATA: /data/postgres
      POSTGRES_DB: game  # <--- ACHTUNG: Die DB heißt "game", nicht "game_db"
    volumes:
      - db:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d game -U game" ] # Healthcheck korrigiert auf korrekte DB/User
      interval: 30s
      timeout: 10s
      retries: 5

  # Dein GameService (muss hinzugefügt werden)
  gameservice:
    build:
      context: . # Pfad zum Dockerfile (evtl anpassen, z.B. ./backend/services/GameService)
      dockerfile: Dockerfile
    container_name: gameservice
    ports:
      - "8082:8082"
    networks:
      - db  # WICHTIG: Muss im gleichen Netzwerk sein
    depends_on:
      db:
        condition: service_healthy # Wartet, bis die DB wirklich bereit ist
    environment:
      # Hier überschreiben wir die Config für den Container
      SERVICE_NAME: "GameService"
      DATABASE_HOST: "db"      # <--- DAS IST DER FIX! (Service Name)
      DATABASE_PORT: "5432"
      DATABASE_USER: "game"
      DATABASE_PASSWORD: "secure"
      DATABASE_NAME: "game"    # <--- Muss zur POSTGRES_DB oben passen
      DATABASE_SSLMODE: "disable"

networks:
  db:
    driver: bridge

volumes:
  db: